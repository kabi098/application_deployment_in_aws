name: Destroy AWS Infrastructure

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Prepare AWS resources for destroy
        run: |
          set -e
          ALB_ARN=$(aws elbv2 describe-load-balancers --names cld400-alb --region ap-south-1 --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || true)
          if [ -n "$ALB_ARN" ]; then
            echo "Found load balancer $ALB_ARN"
            LISTENER_ARNS=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --region ap-south-1 --query 'Listeners[?Protocol==`HTTP`].ListenerArn' --output text 2>/dev/null || true)
            for listener_arn in $LISTENER_ARNS; do
              if [ -n "$listener_arn" ]; then
                RULE_ARNS=$(aws elbv2 describe-rules --listener-arn "$listener_arn" --region ap-south-1 --query 'Rules[?Priority!=`default`].RuleArn' --output text 2>/dev/null || true)
                for rule_arn in $RULE_ARNS; do
                  if [ -n "$rule_arn" ]; then
                    aws elbv2 delete-rule --rule-arn "$rule_arn" --region ap-south-1 2>/dev/null || true
                  fi
                done
                aws elbv2 delete-listener --listener-arn "$listener_arn" --region ap-south-1 2>/dev/null || true
              fi
            done
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" --region ap-south-1 2>/dev/null || true
            aws elbv2 wait load-balancer-available --names cld400-alb --region ap-south-1 2>/dev/null || true
            aws elbv2 wait load-balancer-deleted --names cld400-alb --region ap-south-1 2>/dev/null || true
          fi

      - name: Terraform destroy
        working-directory: terraform
        run: |
          terraform destroy -auto-approve -target=aws_lb.main -target=aws_lb_listener.front_end -target=aws_lb_listener_rule.backend || true
          terraform destroy -auto-approve -refresh=false || true
          terraform destroy -auto-approve || true
