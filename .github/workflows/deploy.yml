name: Deploy to AWS ECS

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/cld400-frontend:latest ./frontend
          docker push ${{ steps.login-ecr.outputs.registry }}/cld400-frontend:latest

      - name: Build and push backend image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/cld400-backend:latest ./backend
          docker push ${{ steps.login-ecr.outputs.registry }}/cld400-backend:latest
