name: Deploy to AWS ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Create ECR repositories if needed
        run: |
          aws ecr describe-repositories --repository-names cld400-frontend --region ap-south-1 >/dev/null 2>&1 || aws ecr create-repository --repository-name cld400-frontend --region ap-south-1 >/dev/null
          aws ecr describe-repositories --repository-names cld400-backend --region ap-south-1 >/dev/null 2>&1 || aws ecr create-repository --repository-name cld400-backend --region ap-south-1 >/dev/null

      - name: Terraform apply for base infrastructure
        working-directory: terraform
        run: |
          terraform import aws_ecr_repository.backend cld400-backend || true
          terraform import aws_ecr_repository.frontend cld400-frontend || true
          terraform import aws_cloudwatch_log_group.ecs /ecs/cld400 || true
          terraform import aws_iam_role.ecs_task_execution cld400-ecs-task-execution || true
          terraform import aws_db_subnet_group.main cld400-db-subnet-group || true
          terraform import aws_elasticache_subnet_group.main cld400-cache-subnet-group || true
          ALB_ARN=$(aws elbv2 describe-load-balancers --names cld400-alb --region ap-south-1 --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || true)
          TG_FRONTEND_ARN=$(aws elbv2 describe-target-groups --names cld400-frontend-tg --region ap-south-1 --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
          TG_BACKEND_ARN=$(aws elbv2 describe-target-groups --names cld400-backend-tg --region ap-south-1 --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
          [ -n "$ALB_ARN" ] && terraform import aws_lb.main "$ALB_ARN" || true
          [ -n "$TG_FRONTEND_ARN" ] && terraform import aws_lb_target_group.frontend "$TG_FRONTEND_ARN" || true
          [ -n "$TG_BACKEND_ARN" ] && terraform import aws_lb_target_group.backend "$TG_BACKEND_ARN" || true
          terraform apply -auto-approve -var="aws_region=ap-south-1"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/cld400-frontend:latest ./frontend
          docker push ${{ steps.login-ecr.outputs.registry }}/cld400-frontend:latest

      - name: Build and push backend image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/cld400-backend:latest ./backend
          docker push ${{ steps.login-ecr.outputs.registry }}/cld400-backend:latest

      - name: Terraform apply with deployed image values
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_region=ap-south-1" \
            -var="frontend_image=${{ steps.login-ecr.outputs.registry }}/cld400-frontend:latest" \
            -var="backend_image=${{ steps.login-ecr.outputs.registry }}/cld400-backend:latest"
