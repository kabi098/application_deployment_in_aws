<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLD400 Prototype</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #123; }
      .container { max-width: 800px; margin: 60px auto; padding: 24px; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
      button { padding: 10px 16px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
      pre { background: #111827; color: #f9fafb; padding: 12px; border-radius: 8px; overflow: auto; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>CLD400 AWS Prototype</h1>
      <p>This page demonstrates a simple frontend that calls the backend API.</p>
      <button onclick="loadMessage()">Call backend</button>
      <pre id="output">Click the button to fetch a response.</pre>
    </div>

    <script>
      async function loadMessage() {
        const output = document.getElementById('output');
        try {
          const response = await fetch('/api/hello');
          const data = await response.json();
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = 'Error: ' + error.message;
        }
      }
    </script>
  </body>
</html>
